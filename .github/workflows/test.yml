name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: bluestock
          POSTGRES_PASSWORD: bluestock_password
          POSTGRES_DB: bluestock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: 'bluestock_api/backend/package-lock.json'
    
    - name: Install Dependencies
      run: |
        cd bluestock_api/backend
        npm ci
    
    - name: Setup Database
      run: |
        cd bluestock_api/backend
        npx prisma db push --skip-generate
      env:
        DATABASE_URL: postgresql://bluestock:bluestock_password@localhost:5432/bluestock_test
    
    - name: Run Tests
      run: |
        cd bluestock_api/backend
        npm test -- --coverage
      env:
        DATABASE_URL: postgresql://bluestock:bluestock_password@localhost:5432/bluestock_test
        UPSTASH_REDIS_REST_URL: http://localhost:6379
        JWT_SECRET: test_secret_key_min_32_characters_long
        NODE_ENV: test
    
    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        directory: ./bluestock_api/backend/coverage
        flags: backend
        fail_ci_if_error: false

  lint-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: 'bluestock_api/backend/package-lock.json'
    
    - name: Install Dependencies
      run: |
        cd bluestock_api/backend
        npm ci
    
    - name: Run ESLint
      run: |
        cd bluestock_api/backend
        npm run lint 2>/dev/null || echo "ESLint not configured"

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ admin-dashboard, b2b-portal, demo-app ]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: '${{ matrix.app }}/package-lock.json'
    
    - name: Install Dependencies
      run: |
        cd ${{ matrix.app }}
        npm ci
    
    - name: Build
      run: |
        cd ${{ matrix.app }}
        npm run build
      env:
        VITE_API_URL: http://localhost:3000/api/v1

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
